<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Conversor I/P</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #eef2f5;
            border-radius: 8px;
        }
        .slider-container {
            width: 80%;
            margin-top: 15px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            width: 80%;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
        }
        .elec-text { color: #d35400; }
        .pneu-text { color: #2980b9; }
        
        /* SVG Animation Styles */
        #flapper, #needle, #outputPipe, #magneticField {
            transition: all 0.2s ease-out;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Conversor Corrente-Pressão (I/P)</h2>
    
    <div class="controls">
        <div class="stats">
            <span class="elec-text">Entrada: <span id="currentVal">4.0</span> mA</span>
            <span class="pneu-text">Saída: <span id="pressureVal">3.0</span> psi</span>
        </div>
        <div class="slider-container">
            <input type="range" id="currentSlider" min="4" max="20" step="0.1" value="4">
        </div>
        <small style="margin-top: 10px; color: #7f8c8d;">Arraste o controle deslizante para ajustar a corrente de entrada.</small>
    </div>

    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="background: #fafafa; border: 1px solid #ddd; border-radius: 8px;">
        
        <path d="M 550,340 L 400,340 L 400,210" stroke="#bce0fd" stroke-width="16" fill="none" stroke-linecap="round" />
        <text x="415" y="365" font-size="14" fill="#555">Ar de Suprimento (20 psi)</text>
        <path d="M 530,340 L 510,330 M 530,340 L 510,350" stroke="#2980b9" stroke-width="2" fill="none" /> <path id="outputPipe" d="M 400,280 L 500,280" stroke="#bce0fd" stroke-width="16" fill="none" stroke-linecap="round" />
        <text x="515" y="285" font-size="14" fill="#555">Saída</text>
        
        <rect x="450" y="330" width="10" height="20" fill="#34495e" />
        <text x="435" y="320" font-size="12" fill="#7f8c8d">Restrição</text>

        <polygon points="395,193 405,193 415,210 385,210" fill="#7f8c8d" />
        <text x="420" y="205" font-size="12" fill="#7f8c8d">Bocal</text>
        
        <g id="exhaustAir" opacity="1">
            <path d="M 390,190 Q 360,195 350,170" stroke="#add8e6" stroke-width="2" fill="none" stroke-dasharray="4" />
            <path d="M 410,190 Q 440,195 450,170" stroke="#add8e6" stroke-width="2" fill="none" stroke-dasharray="4" />
            <text x="320" y="160" font-size="10" fill="#999">Exaustão</text>
        </g>

        <polygon points="140,150 160,150 150,180" fill="#95a5a6" />
        <circle cx="150" cy="180" r="6" fill="#2c3e50" />
        
        <g id="flapper" transform="rotate(0, 150, 180)">
            <rect x="150" y="176" width="260" height="8" fill="#bdc3c7" rx="4" />
            <rect x="250" y="184" width="40" height="4" fill="#7f8c8d" /> 
        </g>

        <text x="35" y="195" font-size="14" fill="#d35400" font-weight="bold">Entrada 4-20 mA</text>
        <path d="M 50,210 L 250,210" stroke="#e67e22" stroke-width="3" fill="none" />
        <path d="M 50,250 L 250,250" stroke="#e67e22" stroke-width="3" fill="none" />
        
        <rect x="250" y="190" width="40" height="70" fill="#95a5a6" rx="2" />
        <text x="245" y="275" font-size="12" fill="#7f8c8d">Eletroímã</text>
        
        <path d="M 245,200 L 295,210 M 245,210 L 295,220 M 245,220 L 295,230 M 245,230 L 295,240 M 245,240 L 295,250" stroke="#d35400" stroke-width="4" fill="none" />
        
        <g id="magneticField" opacity="0.1">
            <path d="M 240,195 Q 270,175 300,195" stroke="#f1c40f" stroke-width="2" fill="none" stroke-dasharray="3" />
            <path d="M 230,195 Q 270,165 310,195" stroke="#f1c40f" stroke-width="2" fill="none" stroke-dasharray="3" />
        </g>

        <circle cx="500" cy="280" r="35" fill="white" stroke="#34495e" stroke-width="4" />
        <circle cx="500" cy="280" r="4" fill="#333" />
        <text x="500" y="295" text-anchor="middle" font-size="10" fill="#777">PSI</text>
        
        <line x1="475" y1="265" x2="480" y2="268" stroke="#333" stroke-width="2" /> <line x1="500" y1="250" x2="500" y2="255" stroke="#333" stroke-width="2" /> <line x1="525" y1="265" x2="520" y2="268" stroke="#333" stroke-width="2" /> <text x="465" y="260" font-size="9" fill="#333">3</text>
        <text x="496" y="245" font-size="9" fill="#333">9</text>
        <text x="525" y="260" font-size="9" fill="#333">15</text>

        <line id="needle" x1="500" y1="280" x2="500" y2="252" stroke="#e74c3c" stroke-width="3" stroke-linecap="round" transform="rotate(-60, 500, 280)" />

    </svg>
</div>

<script>
    const slider = document.getElementById('currentSlider');
    const currentValDisplay = document.getElementById('currentVal');
    const pressureValDisplay = document.getElementById('pressureVal');
    
    // SVG Elements to animate
    const flapper = document.getElementById('flapper');
    const needle = document.getElementById('needle');
    const magneticField = document.getElementById('magneticField');
    const outputPipe = document.getElementById('outputPipe');
    const exhaustAir = document.getElementById('exhaustAir');

    slider.addEventListener('input', (e) => {
        const I = parseFloat(e.target.value);
        currentValDisplay.textContent = I.toFixed(1);

        // Calculate ratios
        // r goes from 0.0 (at 4mA) to 1.0 (at 20mA)
        const r = (I - 4) / 16; 
        
        // Calculate Output Pressure: P = 3 + r * 12
        const P = 3 + (r * 12);
        pressureValDisplay.textContent = P.toFixed(1);

        // 1. Animate Flapper (Rotates DOWN towards nozzle)
        // Flapper rotates from 0 to +1.8 degrees. 
        // Note: Pivot is now at (150, 180)
        flapper.setAttribute('transform', `rotate(${r * 1.8}, 150, 180)`);

        // 2. Animate Gauge Needle
        const needleAngle = (r * 120) - 60;
        needle.setAttribute('transform', `rotate(${needleAngle}, 500, 280)`);

        // 3. Animate Magnetic Field (Opacity increases with current)
        magneticField.setAttribute('opacity', 0.1 + (r * 0.8));

        // 4. Animate Output Pipe Color (Gets darker blue as pressure builds)
        const lightness = 88 - (r * 48);
        outputPipe.setAttribute('stroke', `hsl(206, 80%, ${lightness}%)`);

        // 5. Animate Exhaust Air (Opacity decreases as nozzle is restricted)
        exhaustAir.setAttribute('opacity', 1 - (r * 0.85));
    });
</script>
</body>
</html>
